[theme]
primaryColor = "#1B3358"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FC"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
# Protección XSRF y CORS en sus valores por defecto (activadas): la app no se
# incrusta en otros sitios y los formularios de carga llevan el token.

[browser]
# Sin telemetría de uso hacia Streamlit: una petición de red menos por sesión.
gatherUsageStats = false

[runner]
# Un rerun nuevo cancela el anterior en vez de esperarlo (clics seguidos en
# filtros): menos trabajo encolado por visitante.
fastReruns = true
